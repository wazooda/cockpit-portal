name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install Pillow==11.3.0
      - run: python -m unittest discover -s tests
      - run: python -m py_compile pc/cockpit_portal.py headset/slots.py headset/gen_circle_spv.py
  headset-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n headset/portal.sh
